<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Foodcart Stores – Interactive Mockup</title>
        <link rel="stylesheet" href="assets/mockup.css?v=2">
        <script src="assets/mockup-2.js?v=2"></script>    
    </head>

    <div id="header-placeholder" class=" sticky-top"></div>

        <main class="main" >

            <!-- ============================================ -->
            <!-- PAGE: CHECKOUT -->
            <!-- ============================================ -->
            <div class="page-content">
                
                <div class="page-content-inner container">
                    
                    <h2 class="page-title">Checkout</h2>
                    
                    <div class="checkout-grid">

                        <div class="checkout-form">

                            <h3 style="margin-bottom:16px;">📋 Billing Details</h3>
                            <label>Full Name <span class="required">*</span></label>
                            <input type="text" placeholder="John Doe" value="John Doe">
                            
                            <label>Email <span class="required">*</span></label>
                            <input type="email" placeholder="john@example.com" value="john@example.com">
                            
                            <label>Phone <span class="required">*</span></label>
                            <input type="tel" placeholder="08012345678" value="08012345678">

                            <label>Street / Bus Stop <span class="required">*</span></label>
                            <input type="text" placeholder="123 Awolowo Road, Opposite Shoprite" value="123 Awolowo Road">

                            <!-- CRITICAL: LGA DROPDOWN -->
                            <label>Local Government Area (LGA) <span class="required">*</span></label>
                            <select>
                                <option value="">Select LGA...</option>
                                <option selected>Ikeja</option>
                                <option>Surulere</option>
                                <option>Eti-Osa (Lekki/VI)</option>
                                <option>Lagos Mainland</option>
                                <option>Apapa</option>
                                <option>Alimosho</option>
                                <option>Agege</option>
                                <option>Badagry</option>
                                <option>Epe</option>
                                <option>Ikorodu</option>
                                <option>Kosofe</option>
                                <option>Mushin</option>
                                <option>Ojo</option>
                                <option>Oshodi-Isolo</option>
                                <option>Shomolu</option>
                            </select>

                            <!-- CRITICAL: LANDMARK FIELD -->
                            <label>Landmark / Nearest Junction <span class="required">*</span></label>
                            <input type="text" placeholder="e.g. Beside Total Filling Station" value="Beside Total Filling Station">

                            <label>Delivery Speed</label>
                            <select>
                                <option>🚀 Express (Same-Day) – ₦700</option>
                                <option>📦 Standard (3-5 days) – ₦300</option>
                            </select>

                            <label>Payment Method</label>
                            <div style="display:flex; gap:16px; flex-wrap:wrap; margin-bottom:16px;">
                                <label><input type="radio" name="payment" checked> 💳 Card</label>
                                <label><input type="radio" name="payment"> 🏦 Bank Transfer</label>
                                <label><input type="radio" name="payment"> 📱 USSD</label>
                                <label><input type="radio" name="payment"> 💵 Cash on Delivery</label>
                            </div>

                            <div style="background:#f1f5f9; padding:12px; border-radius:8px; border:1px dashed #94a3b8;">
                                🔒 <span style="color:#64748b;">Paystack iframe (card details) will appear here.</span>
                            </div>
                        
                        </div>
                                            
                        <form id="checkout-form">

                            <!-- Full Name -->
                            <div style="margin-bottom:12px;">
                                <label style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:4px;">Full Name <span style="color:#dc2626;">*</span></label>
                                <input type="text" id="checkout-name" placeholder="John Doe" value="" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px;">
                            </div>

                            <!-- Phone -->
                            <div style="margin-bottom:12px;">
                                <label style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:4px;">Phone Number <span style="color:#dc2626;">*</span></label>
                                <input type="tel" id="checkout-phone" placeholder="08012345678" value="" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px;">
                            </div>

                            <!-- Email -->
                            <div style="margin-bottom:12px;">
                                <label style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:4px;">Email Address <span style="color:#dc2626;">*</span></label>
                                <input type="email" id="checkout-email" placeholder="john@example.com" value="" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px;">
                            </div>

                            <!-- Address -->
                            <div style="margin-bottom:12px;">
                                <label style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:4px;">Street / Bus Stop <span style="color:#dc2626;">*</span></label>
                                <input type="text" id="checkout-address" placeholder="123 Awolowo Road, Opposite Shoprite" value="" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px;">
                            </div>

                            <!-- LGA -->
                            <div style="margin-bottom:12px;">
                                <label style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:4px;">Local Government Area (LGA) <span style="color:#dc2626;">*</span></label>
                                <select id="checkout-lga" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; background:white;">
                                    <option value="">Select LGA...</option>
                                    <option value="Ikeja">Ikeja</option>
                                    <option value="Surulere">Surulere</option>
                                    <option value="Eti-Osa">Eti-Osa (Lekki/VI)</option>
                                    <option value="Lagos Mainland">Lagos Mainland</option>
                                    <option value="Apapa">Apapa</option>
                                    <option value="Alimosho">Alimosho</option>
                                </select>
                            </div>

                            <!-- Payment Method (optional, for demo) -->
                            <div style="margin-bottom:16px;">
                                <label style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:4px;">Payment Method</label>
                                <select id="checkout-payment" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; background:white;">
                                    <option value="card">Card</option>
                                    <option value="bank">Bank Transfer</option>
                                    <option value="ussd">USSD</option>
                                    <option value="cod">Cash on Delivery</option>
                                </select>
                            </div>

                            <!-- Place Order Button -->
                            <button type="submit" class="btn btn-green" style="width:100%; padding:14px; border-radius:8px; font-size:1.1rem; font-weight:700; border:none; cursor:pointer; background:#16a34a; color:white;">
                                🛒 Place Order
                            </button>
                            
                        </form>

                        <div class="order-summary">

                            <h4>🛍️ Your Order</h4>
                            <div class="row"><span>NutraGold Rice (5kg) x2</span><span>₦14,000</span></div>
                            <div class="row"><span>NutraGold Honey Beans (Jumbo) x1</span><span>₦83,000</span></div>
                            <div class="row"><span>Subtotal</span><span>₦97,000</span></div>
                            <div class="row" style="color:#16a34a;"><span>🚚 Express Delivery (Ikeja)</span><span>₦700</span></div>
                            <div class="row total"><span>Total</span><span>₦97,700</span></div>
                            <button class="btn btn-green" style="width:100%; padding:14px; border-radius:8px; font-size:1.1rem; margin-top:12px;">✔ Place Order</button>
                            <p style="font-size:0.75rem; color:#64748b; text-align:center; margin-top:8px;">🔒 Secure transaction via Paystack/Flutterwave</p>

                        </div>
                    
                    </div>

                </div>

            </div>

        </main>

    <div id="footer-placeholder"></div>
    
    <!-- A single, reusable script -->
    <script src="loader.js"></script>
    
</html>
